<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — TrustCare Collection Centre</title>
<link rel="icon" href="assets/logo-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="logo"><img src="assets/logo-icon.png" alt="TrustCare Collection Centre" class="logo-mark">TrustCare</a>
    <nav class="nav-links"></nav>
    <div class="nav-cta"></div>
  </div>
</header>

<div class="auth-shell">
  <div class="card">
    <p class="eyebrow">Sign in</p>
    <h1>Log in to book</h1>
    <p class="sub">Use your email or mobile number — no password needed for this preview.</p>

    <div class="form-error" id="formError">Enter your name and at least one of email or mobile number.</div>

    <form id="loginForm">
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" placeholder="e.g. Asha Rao" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="divider-or">or</div>
      <div class="field">
        <label for="phone">Mobile number</label>
        <input type="tel" id="phone" placeholder="+91 98765 43210" autocomplete="tel">
      </div>
      <button type="submit" class="btn btn-primary btn-full">Continue →</button>
    </form>
    <p class="field-hint" style="margin-top:16px;">By continuing you agree to be contacted about your booking.</p>
  </div>
</div>

<script src="app.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const next = params.get('next') || 'index.html';

  const existing = HD.getUser();
  if (existing) window.location.href = next;

  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const err = document.getElementById('formError');

    if (!name || (!email && !phone)) {
      err.classList.add('show');
      return;
    }
    err.classList.remove('show');
    HD.setUser({ name, email, phone });
    window.location.href = next;
  });
</script>
