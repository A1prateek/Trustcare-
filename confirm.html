<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking confirmed — TrustCare Collection Centre</title>
<link rel="icon" href="assets/logo-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a href="index.html" class="logo"><img src="assets/logo-icon.png" alt="TrustCare Collection Centre" class="logo-mark">TrustCare</a>
    <nav class="nav-links"></nav>
    <div class="nav-cta" id="userMount"></div>
  </div>
</header>

<div class="confirm-shell">
  <p class="eyebrow" id="statusLine">Booking confirmed</p>
  <h1 style="font-family:var(--display); font-size:28px; margin-top:8px;" id="headline">You're all set.</h1>
  <p style="color:var(--ink-soft); font-size:14.5px; margin-top:8px;" id="subline">
    A technician will arrive in your selected window. We'll text updates to your contact number.
  </p>

  <div id="ticketMount"></div>

  <div class="rx-note" style="text-align:left;">
    <span>Pay in cash on the day, or send it ahead via UPI: <strong>skswatantra@axl</strong></span>
  </div>

  <a href="book.html" class="btn btn-primary">Book another visit</a>

  <div class="bookings-list">
    <h3>Your bookings</h3>
    <div id="bookingsMount"></div>
  </div>
</div>

<script src="app.js"></script>
<script>
  HD.requireAuth('confirm.html');
  HD.renderUserPill('userMount');

  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const booking = id ? HD.findBooking(id) : null;

  if (booking) {
    document.getElementById('ticketMount').innerHTML = `
      <div class="ticket">
        <div class="ticket-top">
          <span class="ticket-id">REQUISITION · ${booking.id}</span>
          <span class="ticket-badge">● scheduled</span>
        </div>
        <div class="ticket-row"><span class="k">Patient</span><span class="v">${booking.patient}</span></div>
        <div class="ticket-row"><span class="k">Test</span><span class="v">${booking.tests.join(', ')}</span></div>
        <div class="ticket-perf"></div>
        <div class="ticket-row"><span class="k">Date</span><span class="v">${HD.fmtDate(booking.date)}</span></div>
        <div class="ticket-row"><span class="k">Timing</span><span class="v">${booking.timing}</span></div>
        <div class="ticket-row"><span class="k">Address</span><span class="v">${booking.address}</span></div>
        <div class="ticket-row"><span class="k">Total</span><span class="v">${booking.total !== null ? HD.fmtMoney(booking.total) : 'Confirmed at visit'}</span></div>
        <span class="ticket-stamp">Confirmed</span>
      </div>`;
  } else {
    document.getElementById('statusLine').textContent = 'No booking found';
    document.getElementById('headline').textContent = "We couldn't find that booking.";
    document.getElementById('subline').textContent = 'It may have been made on a different device — bookings are stored locally per device in this preview.';
  }

  // ---- booking history ----
  const all = HD.getBookings();
  const mount = document.getElementById('bookingsMount');
  if (all.length === 0) {
    mount.innerHTML = `<p class="empty-state">No bookings yet on this device.</p>`;
  } else {
    mount.innerHTML = all.map(b => `
      <div class="mini-ticket">
        <span>
          <strong>${b.tests[0]}${b.tests.length > 1 ? ` +${b.tests.length - 1} more` : ''}</strong><br>
          <span class="id">${b.id} · ${HD.fmtDate(b.date)}</span>
        </span>
        <span>${b.total !== null ? HD.fmtMoney(b.total) : 'TBC'}</span>
      </div>`).join('');
  }
</script>
